name: Refresh profile stats

on:
  schedule:
    # Weekly, Sunday 16:17 UTC (Monday 00:17 CST). Odd minute avoids the :00 stampede.
    - cron: "17 16 * * 0"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_profile_stats.py"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate public-repo cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_profile_stats.py

      - name: Commit only when cards change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/overview.svg assets/languages.svg
          if git diff --cached --quiet; then
            echo "Stats unchanged, skipping commit"
            exit 0
          fi
          git commit -m "chore: refresh public language stats"
          git push
